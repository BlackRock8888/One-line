<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#05060b">
  <meta name="description" content="Black Rock Talk — BLACKROCK LAB">
  <title>Black Rock Talk</title>
  <link rel="preload" href="/fonts/manrope-variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div id="app" data-view="welcome" data-phase="idle">

    <section id="welcome" class="view" aria-labelledby="product">
      <header class="bar">
        <span class="brand">BLACKROCK LAB</span>
        <select id="language" aria-label="Language"><option value="ru">RU</option><option value="en">EN</option><option value="ar">AR</option></select>
      </header>
      <div class="hero">
        <div class="mark" aria-hidden="true"><div class="mark-glow"></div><img src="/fox-neon.webp" alt="" width="132" height="132"></div>
        <h1 id="product">Black Rock Talk</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <div class="action">
        <button id="start" class="primary"><span id="start-label" data-i18n="create"></span></button>
        <p id="start-note" class="note" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="room" class="view" aria-label="Room" inert>
      <header class="bar">
        <span class="brand">BLACKROCK LAB</span>
        <span id="timer" class="pill" role="timer"></span>
        <button id="log-open" class="icon-text" data-i18n="log"></button>
      </header>
      <div class="stage">
        <div class="seats">
          <div class="seat" id="seat-self">
            <div class="avatar" id="avatar"><img src="/fox-neon.webp" alt="" width="104" height="104"></div>
            <b data-i18n="you"></b><small id="self-state"></small>
          </div>
          <button class="seat" id="seat-guest" type="button">
            <div class="avatar empty" id="guest-avatar"><span aria-hidden="true">+</span></div>
            <b id="guest-name" data-i18n="invite"></b><small id="guest-state"></small>
          </button>
        </div>
        <div class="invite" id="invite-box">
          <input id="invite-link" readonly aria-label="Link">
          <button id="copy-invite" data-i18n="copy"></button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button id="enable-audio" class="ghost" data-i18n="enableAudio" hidden></button>
      </div>
      <nav class="dock" aria-label="Controls">
        <button id="mute" aria-pressed="false"><i class="ico ico-mic" aria-hidden="true"></i><span data-i18n="mute"></span></button>
        <button id="invite"><i class="ico ico-share" aria-hidden="true"></i><span data-i18n="share"></span></button>
        <button id="chat-toggle" aria-controls="chat-panel" aria-expanded="false"><i class="ico ico-chat" aria-hidden="true"></i><span data-i18n="chat"></span><em id="unread" hidden></em></button>
        <button id="leave" class="leave"><i class="ico ico-leave" aria-hidden="true"></i><span data-i18n="leave"></span></button>
      </nav>
      <aside id="chat-panel" class="chat" aria-label="Chat" data-open="false" inert>
        <div class="chat-head"><span data-i18n="chat"></span><button id="chat-close" data-i18n-label="chatClose" aria-label="Close chat">×</button></div>
        <div id="chat-messages" role="log" aria-live="polite"></div>
        <p id="chat-note" class="note" data-i18n="chatNote"></p>
        <form id="chat-form"><input id="chat-input" maxlength="1000" autocomplete="off" enterkeyhint="send" data-i18n-ph="chatWait" aria-label="Message" disabled><button id="chat-send" data-i18n="send" disabled></button></form>
      </aside>
    </section>

    <dialog id="log-dialog"><div class="log-head"><b data-i18n="logTitle"></b><button id="log-close" data-i18n="close"></button></div><pre id="connection-log" tabindex="0"></pre><p class="note" data-i18n="logNote"></p><button id="copy-diagnostics" data-i18n="logCopy"></button></dialog>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
